# Rocky Linux 9 - unattended Kickstart for the Packer golden image (OMNI-7)
#
# Served by Packer's built-in HTTP server and loaded with the boot argument:
#   inst.ks=http://{{ .HTTPIP }}:{{ .HTTPPort }}/ks.cfg
# See infra/packer/README.md.

text
skipx
eula --agreed
firstboot --disabled

# Installation sources. AppStream holds cloud-init, cloud-utils-growpart and
# qemu-guest-agent and is not on the minimal/boot ISOs, so pull from mirrors.
url --mirrorlist="https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=BaseOS-9"
repo --name=AppStream --mirrorlist="https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=AppStream-9"

lang en_US.UTF-8
keyboard us
timezone UTC --utc

network --bootproto=dhcp --device=link --activate --onboot=on

selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,qemu-guest-agent

# Plain partitions (no LVM) so cloud-init growpart can extend / on disk resize.
bootloader --location=mbr
zerombr
clearpart --all --initlabel
autopart --type=plain

# Root is locked; Packer connects as 'rocky'.
rootpw --lock
# BUILD-ONLY password used by Packer's SSH communicator. The Packer cleanup
# step must lock it (passwd -l rocky) before the template is sealed; cloud-init
# injects real SSH keys on clones.
user --name=rocky --plaintext --password=rockypass --groups=wheel

# No --ignoremissing: a missing package must fail the install loudly.
%packages
@^minimal-environment
qemu-guest-agent
cloud-init
cloud-utils-growpart
curl
sudo
tar
%end

%post --erroronfail --log=/root/ks-post.log
set -euxo pipefail

# Passwordless sudo for the build user (validated so a typo can't lock us out)
echo "rocky ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/rocky
chmod 0440 /etc/sudoers.d/rocky
visudo -cf /etc/sudoers.d/rocky

# Acceptance check: required packages are installed
rpm -q qemu-guest-agent cloud-init cloud-utils-growpart

systemctl enable qemu-guest-agent

# cloud-init 24.x (Rocky 9.6+) renamed cloud-init.service to
# cloud-init-network.service and added cloud-init-main.service, so enable
# whichever units this package actually ships.
for unit in cloud-init-local cloud-init-main cloud-init cloud-init-network \
            cloud-config cloud-final; do
    if systemctl list-unit-files "${unit}.service" --no-legend | grep -q "^${unit}.service"; then
        systemctl enable "${unit}.service"
    fi
done

# Clones must generate their own identity
truncate -s 0 /etc/machine-id
rm -f /var/lib/systemd/random-seed
%end

reboot
